# PixelArt marketing site (Next.js static export with basePath /pixelart)
#
# Build: npm run build  →  files in marketing/out/
# Deploy out/ to the server, e.g. /var/www/pixelart-marketing/out/
#
# URLs map as:
#   /pixelart/          → out/index.html
#   /pixelart/privacy/  → out/privacy/index.html
#   /pixelart/_next/... → out/_next/...

location = /pixelart {
    return 302 /pixelart/;
}

location /pixelart/ {
    alias /var/www/pixelart-marketing/out/;
    try_files $uri $uri.html $uri/index.html =404;
}
